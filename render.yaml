services:
  - type: web
    name: shree-reempu-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn stream:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: STREAM_API_TOKEN
        sync: false
      - key: MAX_VIDEO_BYTES
        value: "5000000000"
